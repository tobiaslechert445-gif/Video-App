[package]
name = "my_view_app"
version = "1.4.2"
description = "My View Media Player & Studio"
authors = ["tobiaslechert445-gif"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
rfd = "0.15"
base64 = "0.22"
open = "5"
